<!DOCTYPE html>
<html lang="en">
<head>
<script src="lock.js"></script>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Luca Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="syncStatus.js" defer></script>
<script src="sync.js" defer></script>
<script src="dataLayer.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger: #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(224, 118, 88, 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page {
  max-width: 1100px;
  margin: 0 auto;
}

/* ===== Component 1: page title ===== */
.dash-title {
  margin: 0 0 14px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

/* ===== Component 2: Goal Ticker ===== */
.ticker-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px;
  margin-bottom: 18px;
}
.goal-ticker {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px;
  border-radius: 12px;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.30) 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.goal-ticker::after {
  content: '';
  position: absolute; top: 0; bottom: 0;
  width: 30%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
  pointer-events: none;
  animation: ticker-sweep 8s linear infinite;
}
@keyframes ticker-sweep {
  0%   { left: -40%; }
  100% { left: 110%; }
}
.goal-ticker-led { display: inline-flex; align-items: center; }
.goal-ticker-led-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #6BE3A4;
  box-shadow: 0 0 8px rgba(107,227,164,0.7);
  animation: led-pulse 1.6s ease-in-out infinite;
}
@keyframes led-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.45; transform: scale(0.85); }
}
.goal-ticker-label {
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 800;
  letter-spacing: 0.18em;
  color: var(--text-tertiary);
}
.goal-ticker-stage {
  position: relative; overflow: hidden;
  flex: 1; height: 22px;
}
.goal-ticker-row {
  position: absolute; inset: 0;
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono);
  font-size: 12.5px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  white-space: nowrap;
  opacity: 1;
  transition: opacity 0.22s ease;
}
.goal-ticker-row.is-fading { opacity: 0; }
.goal-ticker-status {
  display: inline-flex; justify-content: center;
  width: 18px;
  color: var(--text-tertiary);
}
.goal-ticker-status[data-status="done"]    { color: var(--success); }
.goal-ticker-status[data-status="pending"] { color: var(--text-tertiary); }
.goal-ticker-text {
  flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.goal-ticker-meta {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  color: var(--text-secondary);
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
}
@media (max-width: 480px) {
  .goal-ticker { padding: 9px 12px; }
  .goal-ticker-label { font-size: 9px; letter-spacing: 0.14em; }
  .goal-ticker-row { font-size: 12px; }
  .goal-ticker-meta { font-size: 10px; padding: 2px 7px; }
}

/* ===== Component 3: Sleep Summary (manual entry, see health.html#sleep) ===== */
.sleep-summary-wrap {
  display: flex; align-items: center;
  gap: 18px;
  padding: 20px 22px;
  margin-bottom: 22px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.sleep-summary-icon { font-size: 34px; line-height: 1; flex-shrink: 0; }
.sleep-summary-body { flex: 1; min-width: 0; }
.sleep-summary-label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 4px;
}
.sleep-summary-value {
  font-size: 22px; font-weight: 800;
  color: var(--text-primary); letter-spacing: -0.02em;
}
.sleep-summary-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.sleep-summary-link {
  flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-primary); text-decoration: none; font-size: 18px;
  transition: background 0.15s, transform 0.12s;
}
.sleep-summary-link:hover { background: rgba(255,255,255,0.10); }
.sleep-summary-link:active { transform: scale(0.94); }
@media (max-width: 480px) {
  .sleep-summary-wrap { padding: 16px 18px; gap: 14px; }
  .sleep-summary-icon { font-size: 28px; }
  .sleep-summary-value { font-size: 19px; }
}

/* ===== Component 4: section + Tasks ===== */
.section { margin-top: 8px; }
.section-title {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.section-title::before {
  content: ''; width: 18px; height: 1px;
  background: var(--text-tertiary); opacity: 0.6;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
}

.hidden { display: none !important; }

.gm-card {
  position: relative;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  transition: background 0.4s;
  overflow: hidden;
}
.gm-card.gm-all-done::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(107,227,164,0.10), transparent 60%);
  pointer-events: none;
}

.gm-header {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  margin-bottom: 16px;
}
.gm-eyebrow {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
}
.tk-pending-pill {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  color: var(--text-secondary);
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.07);
  transition: background 0.25s, color 0.25s, border-color 0.25s;
}
.gm-all-done .tk-pending-pill {
  background: rgba(107,227,164,0.10);
  color: var(--success);
  border-color: rgba(107,227,164,0.28);
}

/* ---- add task ---- */
.tk-add {
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.tk-add-main { display: flex; gap: 8px; align-items: center; }
.tk-input {
  flex: 1; min-width: 0;
  padding: 11px 14px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  background: rgba(0,0,0,0.28);
  color: var(--text-primary);
  font-family: inherit; font-size: 14px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.tk-input::placeholder { color: var(--text-tertiary); }
.tk-input:focus { border-color: rgba(255,255,255,0.28); background: rgba(0,0,0,0.36); }
.tk-add-extra {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  max-height: 0;
  opacity: 0;
  margin-top: 0;
  overflow: hidden;
  transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.22s ease, margin-top 0.28s ease;
}
.tk-add.tk-expanded .tk-add-extra {
  max-height: 60px;
  opacity: 1;
  margin-top: 10px;
}
.tk-input-date {
  color-scheme: dark;
  min-width: 0;
  font-size: 13px;
  padding: 10px 12px;
}
.gm-add {
  flex-shrink: 0;
  padding: 11px 20px;
  border: 0; border-radius: 12px;
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
  color: #0A0A0B;
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 2px 8px rgba(0,0,0,0.35),
    0 8px 22px rgba(0,0,0,0.25);
  transition: transform 0.1s, filter 0.15s;
}
.gm-add:hover { filter: brightness(1.06); transform: translateY(-1px); }
.gm-add:active { transform: translateY(0); }

/* ---- groups + rows ---- */
.tk-groups { display: flex; flex-direction: column; gap: 18px; }
.tk-group-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.tk-group-overdue .tk-group-label { color: var(--danger); }
.tk-group-today .tk-group-label { color: var(--warning); }
.tk-group-count { font-family: var(--font-mono); font-weight: 600; color: inherit; opacity: 0.75; }

.goal-list { list-style: none; margin: 0; padding: 0; }
.empty-state {
  text-align: center;
  font-size: 12.5px; font-style: italic;
  color: var(--text-tertiary);
  padding: 26px 0;
}

.gm-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px;
  margin-bottom: 6px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  transition: background 0.2s, opacity 0.3s ease, max-height 0.32s ease, margin 0.32s ease, padding 0.32s ease, border-width 0.32s ease;
  position: relative;
  overflow: hidden;
  max-height: 140px;
}
.gm-row:hover { background: rgba(255,255,255,0.06); }
.gm-row.tk-completing .tk-text-main {
  text-decoration: line-through;
  text-decoration-color: rgba(255,255,255,0.4);
  opacity: 0.55;
  transition: opacity 0.3s ease, text-decoration-color 0.3s ease;
}
.gm-row.tk-completing .tk-text-sub { opacity: 0.35; transition: opacity 0.3s ease; }
.gm-row.tk-collapsing {
  opacity: 0;
  max-height: 0;
  margin-bottom: 0;
  padding-top: 0; padding-bottom: 0;
  border-width: 0;
}
.gm-row.tk-entering { animation: tk-row-in 0.3s cubic-bezier(0.34,1.2,0.64,1); }
@keyframes tk-row-in {
  from { opacity: 0; transform: translateY(-6px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.gm-check {
  appearance: none; -webkit-appearance: none;
  width: 22px; height: 22px; flex-shrink: 0;
  margin: 1px 0 0;
  border: 1.5px solid rgba(255,255,255,0.18);
  background: rgba(0,0,0,0.28);
  border-radius: 7px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.25s;
}
.gm-check:checked {
  background: #6BE3A4;
  border-color: #6BE3A4;
  box-shadow: 0 0 12px rgba(107,227,164,0.40);
}
.gm-check:checked::after {
  content: '';
  position: absolute; left: 6px; top: 2px;
  width: 6px; height: 11px;
  border: solid #0A0A0B;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
  animation: gm-check-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes gm-check-pop {
  from { transform: rotate(45deg) scale(0); }
  to   { transform: rotate(45deg) scale(1); }
}

.tk-body { flex: 1; min-width: 0; }
.tk-text-main { font-size: 14px; color: var(--text-primary); }
.tk-text-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.tk-text-date {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--text-tertiary);
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  margin-top: 1px;
  white-space: nowrap;
}
.tk-group-overdue .tk-text-date { color: var(--danger); background: rgba(255,107,107,0.10); }

.tk-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity 0.2s; }
.gm-row:hover .tk-actions { opacity: 1; }
.tk-icon-btn {
  border: 0; background: transparent;
  color: var(--text-tertiary);
  font-size: 14px;
  cursor: pointer;
  width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px;
  transition: color 0.2s, background 0.2s;
}
.tk-icon-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
.tk-icon-btn.tk-delete:hover { color: var(--danger); }

/* ---- inline edit ---- */
.tk-edit-form { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.tk-edit-row { display: flex; gap: 6px; }
.tk-edit-form .tk-input { padding: 8px 10px; font-size: 13px; border-radius: 8px; }
.tk-edit-actions { display: flex; gap: 4px; flex-shrink: 0; align-self: flex-start; }

/* ---- completed (collapsible) ---- */
.gm-show-toggle {
  width: 100%;
  margin: 6px 0 0;
  padding: 9px;
  border: 1px dashed rgba(255,255,255,0.12);
  border-radius: 10px;
  background: transparent;
  color: var(--text-tertiary);
  font-family: inherit;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}
.gm-show-toggle:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.22); }
.tk-completed-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.tk-completed-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(255,255,255,0.02);
  font-size: 13px;
}
.tk-completed-text {
  flex: 1; min-width: 0;
  color: var(--text-tertiary);
  text-decoration: line-through;
  text-decoration-color: rgba(255,255,255,0.25);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tk-undo-btn {
  border: 0; background: transparent;
  color: var(--text-tertiary);
  font-size: 13px; cursor: pointer;
  padding: 4px 6px; border-radius: 6px;
  opacity: 0.7; transition: opacity 0.2s, color 0.2s;
}
.tk-undo-btn:hover { opacity: 1; color: var(--text-primary); }

@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .gm-card { padding: 16px; }
  .tk-add-extra { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page">

  <h1 class="dash-title">Luca Dashboard</h1>

  <div class="ticker-row">
    <div class="goal-ticker" id="goalTicker" aria-live="polite" aria-atomic="true">
      <div class="goal-ticker-led"><span class="goal-ticker-led-dot"></span></div>
      <div class="goal-ticker-label">GOALS</div>
      <div class="goal-ticker-stage" id="goalTickerStage">
        <div class="goal-ticker-row">
          <span class="goal-ticker-status" data-status="">—</span>
          <span class="goal-ticker-text">Loading…</span>
        </div>
      </div>
      <div class="goal-ticker-meta" id="goalTickerMeta">0/0</div>
    </div>
  </div>

  <div class="sleep-summary-wrap" id="sleepSummaryWrap">
    <div class="sleep-summary-icon">🌙</div>
    <div class="sleep-summary-body">
      <div class="sleep-summary-label">Last night</div>
      <div class="sleep-summary-value" id="sleepSummaryValue">No data yet</div>
      <div class="sleep-summary-sub" id="sleepSummarySub">Log your first night to start tracking.</div>
    </div>
    <a href="health.html#sleep" class="sleep-summary-link" aria-label="Open sleep tracker" title="Open sleep tracker">→</a>
  </div>

  <div class="section">
    <div class="section-title">Tasks</div>

    <div class="gm-card" id="taskCard">
      <div class="gm-header">
        <div class="gm-eyebrow">Tasks</div>
        <div class="tk-pending-pill" id="tkPendingPill">0 pending</div>
      </div>

      <div class="tk-add" id="tkAdd">
        <div class="tk-add-main">
          <input id="tkTextInput" class="tk-input" type="text" placeholder="New task…" autocomplete="off">
          <button type="button" id="tkAddBtn" class="gm-add">+ Add</button>
        </div>
        <div class="tk-add-extra" id="tkAddExtra">
          <input id="tkSubtitleInput" class="tk-input" type="text" placeholder="Subtitle (optional)" autocomplete="off">
          <input id="tkDateInput" class="tk-input tk-input-date" type="date">
        </div>
      </div>

      <div id="tkLoading" class="empty-state">Cargando tareas…</div>
      <div id="tkEmpty" class="empty-state hidden">Nada pendiente — agregá una tarea.</div>
      <div id="tkGroups" class="tk-groups"></div>

      <button type="button" id="tkCompletedToggle" class="gm-show-toggle hidden">Completed</button>
      <div id="tkCompletedList" class="tk-completed-list hidden"></div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ---------- DataLayer-backed state ----------
  // dlReady flips true once initTasksDataLayer (bottom) resolves; tasksCache
  // holds every row from the 'tasks' collection (both pending and done —
  // done rows are kept locally too so the ticker/legacy mirror below can
  // compute "done today" without a second round-trip).
  let dlReady = false;
  let tasksCache = [];
  let animating = 0; // >0 while a row's complete/delete animation owns the DOM
  const newlyAddedIds = new Set(); // rows created locally this session — play entrance animation once

  const MIGRATION_LS_FLAG = 'tasks_migrated_v1';

  // ---------- date helpers (new model: plain calendar dates, no 6 AM rollover) ----------
  function pad2(n) { return String(n).padStart(2, '0'); }
  function dateToKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayStr() { return dateToKey(new Date()); }
  function tomorrowStr() { const d = new Date(); d.setDate(d.getDate() + 1); return dateToKey(d); }

  const DOW_ES = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  const MON_ES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  function humanDate(dueDate) {
    if (!dueDate) return '—';
    if (dueDate === todayStr()) return 'Hoy';
    if (dueDate === tomorrowStr()) return 'Mañana';
    const parts = dueDate.split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    return DOW_ES[d.getDay()] + ' ' + d.getDate() + ' ' + MON_ES[d.getMonth()];
  }

  // Legacy compat shim (main.html and topbar.js are the only two places
  // that ever wrote/read this key — see project memory on app_state/
  // appKey mapping): topbar.js's nav badge AND index.html's read-only
  // "Goals" stat tile both read localStorage['goals:' + <6AM-rollover
  // date>] directly, never via DataLayer, and can't be edited in this
  // task (topbar.js is off-limits). We keep feeding that exact key from
  // the new tasks data so both keep working unchanged; the initCloudSync
  // bridge at the bottom of this file (untouched) keeps relaying it
  // cross-device exactly as it already did before this migration.
  function legacyActiveDateKey() {
    const now = new Date();
    if (now.getHours() < 6) { const d = new Date(now); d.setDate(d.getDate() - 1); return dateToKey(d); }
    return dateToKey(now);
  }
  function refreshLegacyGoalsMirror() {
    try {
      const key = legacyActiveDateKey();
      const todays = tasksCache.filter((t) => t.dueDate === key).map((t) => ({ text: t.text, done: !!t.done }));
      localStorage.setItem('goals:' + key, JSON.stringify(todays));
    } catch (e) {}
  }

  function genTaskId() { return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }

  // ---------- migration: goals_daily -> tasks (one-shot, idempotent, defensive) ----------
  async function migrateGoalsToTasksIfNeeded() {
    try {
      if (localStorage.getItem(MIGRATION_LS_FLAG) === '1') return;
      const flag = await DataLayer.getSingleton('tasks_migration');
      if (flag && flag.done) { localStorage.setItem(MIGRATION_LS_FLAG, '1'); return; }

      const dailyRows = await DataLayer.list('goals_daily');
      const existingTasks = await DataLayer.list('tasks');
      const seen = new Set(existingTasks.map((t) => (t.text || '') + '|' + (t.dueDate || '')));
      let migrated = 0;

      if (Array.isArray(dailyRows)) {
        for (const row of dailyRows) {
          const dateStr = row.id;
          const items = Array.isArray(row.items) ? row.items : [];
          let dayTs = Date.now();
          try {
            const parts = String(dateStr).split('-').map(Number);
            const ts = new Date(parts[0], parts[1] - 1, parts[2]).getTime();
            if (!isNaN(ts)) dayTs = ts;
          } catch (e) {}

          for (const item of items) {
            if (!item || !item.text) continue;
            const dedupeKey = item.text + '|' + dateStr;
            if (seen.has(dedupeKey)) continue;
            seen.add(dedupeKey);
            const done = !!item.done;
            const id = genTaskId();
            await DataLayer.put('tasks', id, {
              text: item.text,
              subtitle: '',
              dueDate: dateStr,
              done: done,
              createdAt: dayTs,
              completedAt: done ? dayTs : null,
            });
            migrated++;
          }
        }
      }

      await DataLayer.putSingleton('tasks_migration', { done: true, at: Date.now() });
      localStorage.setItem(MIGRATION_LS_FLAG, '1');
      console.log('[tasks migration] migrated ' + migrated + ' task(s) from goals_daily.');
    } catch (e) {
      console.warn('[tasks migration] failed — will retry next load', e);
    }
  }

  // ---------- CRUD ----------
  function taskPayload(t) {
    return { text: t.text, subtitle: t.subtitle || '', dueDate: t.dueDate || null, done: !!t.done, createdAt: t.createdAt, completedAt: t.completedAt || null };
  }
  function upsertLocal(id, payload) {
    const idx = tasksCache.findIndex((t) => t.id === id);
    const row = Object.assign({ id: id }, payload);
    if (idx >= 0) tasksCache[idx] = row; else tasksCache.push(row);
  }

  function scheduleRender() {
    if (animating > 0) return;
    renderAll();
  }

  async function createTask(text, subtitle, dueDate) {
    const id = genTaskId();
    const payload = { text: text, subtitle: subtitle || '', dueDate: dueDate || null, done: false, createdAt: Date.now(), completedAt: null };
    upsertLocal(id, payload);
    newlyAddedIds.add(id);
    refreshLegacyGoalsMirror();
    scheduleRender();
    if (dlReady) await DataLayer.put('tasks', id, payload);
  }

  function completeTaskAnimated(task, rowEl) {
    animating++;
    rowEl.classList.add('tk-completing');
    const completedAt = Date.now();
    const payload = taskPayload(Object.assign({}, task, { done: true, completedAt: completedAt }));
    upsertLocal(task.id, payload);
    refreshLegacyGoalsMirror();
    if (dlReady) DataLayer.put('tasks', task.id, payload);
    setTimeout(() => {
      rowEl.classList.add('tk-collapsing');
      setTimeout(() => { animating--; if (animating === 0) renderAll(); }, 320);
    }, 300);
  }

  async function uncompleteTask(task) {
    const payload = taskPayload(Object.assign({}, task, { done: false, completedAt: null }));
    upsertLocal(task.id, payload);
    refreshLegacyGoalsMirror();
    renderAll();
    if (dlReady) await DataLayer.put('tasks', task.id, payload);
  }

  async function saveTaskEdit(task, text, subtitle, dueDate) {
    const payload = taskPayload(Object.assign({}, task, { text: text, subtitle: subtitle || '', dueDate: dueDate || null }));
    upsertLocal(task.id, payload);
    refreshLegacyGoalsMirror();
    renderAll();
    if (dlReady) await DataLayer.put('tasks', task.id, payload);
  }

  function deleteTaskAnimated(task, rowEl) {
    animating++;
    rowEl.classList.add('tk-collapsing');
    setTimeout(() => {
      tasksCache = tasksCache.filter((t) => t.id !== task.id);
      refreshLegacyGoalsMirror();
      animating--;
      if (animating === 0) renderAll();
      if (dlReady) DataLayer.remove('tasks', task.id);
    }, 300);
  }

  // ---------- grouping ----------
  function groupPending(list) {
    const today = todayStr();
    const pending = list.filter((t) => !t.done);
    const overdue  = pending.filter((t) => t.dueDate && t.dueDate < today).sort((a, b) => a.dueDate.localeCompare(b.dueDate) || a.createdAt - b.createdAt);
    const todayG   = pending.filter((t) => t.dueDate === today).sort((a, b) => a.createdAt - b.createdAt);
    const upcoming = pending.filter((t) => t.dueDate && t.dueDate > today).sort((a, b) => a.dueDate.localeCompare(b.dueDate) || a.createdAt - b.createdAt);
    const someday  = pending.filter((t) => !t.dueDate).sort((a, b) => a.createdAt - b.createdAt);
    return [
      { key: 'overdue',  label: 'Overdue',  items: overdue },
      { key: 'today',    label: 'Today',    items: todayG },
      { key: 'upcoming', label: 'Upcoming', items: upcoming },
      { key: 'someday',  label: 'Someday',  items: someday },
    ].filter((g) => g.items.length);
  }

  // ---------- row building ----------
  function enterEditMode(task, li) {
    li.innerHTML = '';
    const form = document.createElement('div');
    form.className = 'tk-edit-form';

    const textInput = document.createElement('input');
    textInput.className = 'tk-input'; textInput.type = 'text'; textInput.value = task.text;
    form.appendChild(textInput);

    const row2 = document.createElement('div');
    row2.className = 'tk-edit-row';
    const subInput = document.createElement('input');
    subInput.className = 'tk-input'; subInput.type = 'text'; subInput.placeholder = 'Subtitle (optional)'; subInput.value = task.subtitle || '';
    const dateInput = document.createElement('input');
    dateInput.className = 'tk-input tk-input-date'; dateInput.type = 'date'; dateInput.value = task.dueDate || '';
    row2.appendChild(subInput); row2.appendChild(dateInput);
    form.appendChild(row2);
    li.appendChild(form);

    const actions = document.createElement('div');
    actions.className = 'tk-edit-actions';
    const saveBtn = document.createElement('button');
    saveBtn.type = 'button'; saveBtn.className = 'tk-icon-btn'; saveBtn.title = 'Guardar'; saveBtn.textContent = '✓';
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button'; cancelBtn.className = 'tk-icon-btn'; cancelBtn.title = 'Cancelar'; cancelBtn.textContent = '×';

    function commit() {
      const t = textInput.value.trim();
      if (!t) return;
      saveTaskEdit(task, t, subInput.value.trim(), dateInput.value || null);
    }
    saveBtn.addEventListener('click', commit);
    cancelBtn.addEventListener('click', () => renderAll());
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); renderAll(); }
    });

    actions.appendChild(saveBtn); actions.appendChild(cancelBtn);
    li.appendChild(actions);
    textInput.focus();
  }

  function buildTaskRow(task, groupKey) {
    const li = document.createElement('li');
    li.className = 'gm-row';
    if (newlyAddedIds.has(task.id)) { li.classList.add('tk-entering'); newlyAddedIds.delete(task.id); }

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'gm-check';
    cb.checked = false;
    cb.addEventListener('change', () => { if (cb.checked) completeTaskAnimated(task, li); });
    li.appendChild(cb);

    const body = document.createElement('div');
    body.className = 'tk-body';
    const main = document.createElement('div');
    main.className = 'tk-text-main';
    main.textContent = task.text;
    body.appendChild(main);
    if (task.subtitle) {
      const sub = document.createElement('div');
      sub.className = 'tk-text-sub';
      sub.textContent = task.subtitle;
      body.appendChild(sub);
    }
    li.appendChild(body);

    const dateBadge = document.createElement('div');
    dateBadge.className = 'tk-text-date';
    dateBadge.textContent = humanDate(task.dueDate);
    li.appendChild(dateBadge);

    const actions = document.createElement('div');
    actions.className = 'tk-actions';
    const editBtn = document.createElement('button');
    editBtn.type = 'button'; editBtn.className = 'tk-icon-btn'; editBtn.title = 'Editar'; editBtn.setAttribute('aria-label', 'Editar tarea');
    editBtn.textContent = '✎';
    editBtn.addEventListener('click', () => enterEditMode(task, li));
    actions.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.type = 'button'; delBtn.className = 'tk-icon-btn tk-delete'; delBtn.title = 'Borrar'; delBtn.setAttribute('aria-label', 'Borrar tarea');
    delBtn.textContent = '×';
    delBtn.addEventListener('click', () => deleteTaskAnimated(task, li));
    actions.appendChild(delBtn);

    li.appendChild(actions);
    return li;
  }

  // ---------- renderers ----------
  function renderGroups() {
    const wrap = document.getElementById('tkGroups');
    wrap.innerHTML = '';
    const groups = groupPending(tasksCache);

    document.getElementById('tkEmpty').classList.toggle('hidden', groups.length > 0);
    document.getElementById('taskCard').classList.toggle('gm-all-done', tasksCache.length > 0 && groups.length === 0);

    groups.forEach((g) => {
      const section = document.createElement('div');
      section.className = 'tk-group tk-group-' + g.key;

      const label = document.createElement('div');
      label.className = 'tk-group-label';
      label.textContent = g.label + ' ';
      const count = document.createElement('span');
      count.className = 'tk-group-count';
      count.textContent = String(g.items.length);
      label.appendChild(count);
      section.appendChild(label);

      const ul = document.createElement('ul');
      ul.className = 'goal-list';
      g.items.forEach((t) => ul.appendChild(buildTaskRow(t, g.key)));
      section.appendChild(ul);

      wrap.appendChild(section);
    });

    const pendingCount = tasksCache.filter((t) => !t.done).length;
    document.getElementById('tkPendingPill').textContent = pendingCount + ' pending';
  }

  function renderCompleted() {
    const done = tasksCache.filter((t) => t.done).sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
    const toggle = document.getElementById('tkCompletedToggle');
    const list = document.getElementById('tkCompletedList');
    if (!done.length) { toggle.classList.add('hidden'); list.classList.add('hidden'); list.innerHTML = ''; return; }
    toggle.classList.remove('hidden');
    const isOpen = !list.classList.contains('hidden');
    toggle.textContent = 'Completed (' + done.length + ')' + (isOpen ? ' ▴' : ' ▾');
    if (!isOpen) return;
    list.innerHTML = '';
    done.slice(0, 30).forEach((t) => {
      const row = document.createElement('div');
      row.className = 'tk-completed-row';
      const text = document.createElement('span');
      text.className = 'tk-completed-text';
      text.textContent = t.text;
      row.appendChild(text);
      const undo = document.createElement('button');
      undo.type = 'button'; undo.className = 'tk-undo-btn'; undo.title = 'Marcar como pendiente'; undo.setAttribute('aria-label', 'Marcar como pendiente');
      undo.textContent = '↺';
      undo.addEventListener('click', () => uncompleteTask(t));
      row.appendChild(undo);
      list.appendChild(row);
    });
  }
  document.getElementById('tkCompletedToggle').addEventListener('click', () => {
    document.getElementById('tkCompletedList').classList.toggle('hidden');
    renderCompleted();
  });

  function renderAll() {
    document.getElementById('tkLoading').classList.add('hidden');
    renderGroups();
    renderCompleted();
  }

  // ---------- Add task form ----------
  const tkAdd = document.getElementById('tkAdd');
  const tkTextInput = document.getElementById('tkTextInput');
  const tkSubtitleInput = document.getElementById('tkSubtitleInput');
  const tkDateInput = document.getElementById('tkDateInput');
  const tkAddBtn = document.getElementById('tkAddBtn');

  tkTextInput.addEventListener('focus', () => tkAdd.classList.add('tk-expanded'));
  document.addEventListener('click', (e) => {
    if (tkAdd.contains(e.target)) return;
    if (!tkSubtitleInput.value.trim() && !tkDateInput.value) tkAdd.classList.remove('tk-expanded');
  });

  function submitAdd() {
    const text = tkTextInput.value.trim();
    if (!text) return;
    const subtitle = tkSubtitleInput.value.trim();
    const dueDate = tkDateInput.value || null;
    tkTextInput.value = ''; tkSubtitleInput.value = ''; tkDateInput.value = '';
    tkAdd.classList.remove('tk-expanded');
    createTask(text, subtitle, dueDate);
    tkTextInput.focus();
  }
  tkAddBtn.addEventListener('click', submitAdd);
  tkTextInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitAdd(); } });
  tkSubtitleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitAdd(); } });

  // ---------- Goal Ticker (re-derived from tasksCache: "today" = tasks due today) ----------
  const tickerStage = document.getElementById('goalTickerStage');
  const tickerMeta  = document.getElementById('goalTickerMeta');
  let cycleIdx = 0;
  let tickerTimer = null;

  function buildTickerItems() {
    const today = todayStr();
    const todays = tasksCache.filter((t) => t.dueDate === today);
    const total = todays.length;
    const done  = todays.filter((t) => t.done).length;
    if (total === 0) return { items: [{ status: 'empty', text: 'No goals set for today — add one to get rolling.' }], done, total };
    if (done === total) return { items: [{ status: 'done', text: '✓ All goals done — solid day.' }], done, total };
    const items = todays.filter((t) => !t.done).map((t) => ({ status: 'pending', text: t.text }));
    return { items, done, total };
  }

  function statusGlyph(status) {
    if (status === 'done') return '✓';
    if (status === 'pending') return '○';
    return '·';
  }

  let firstTick = true;
  function tick() {
    const { items, done, total } = buildTickerItems();
    if (cycleIdx >= items.length) cycleIdx = 0;
    const item = items[cycleIdx];
    cycleIdx = (cycleIdx + 1) % items.length;
    tickerMeta.textContent = done + '/' + total;

    let row = tickerStage.querySelector('.goal-ticker-row');
    if (!row) {
      row = document.createElement('div');
      row.className = 'goal-ticker-row';
      row.innerHTML =
        '<span class="goal-ticker-status"></span>' +
        '<span class="goal-ticker-text"></span>';
      tickerStage.appendChild(row);
    }

    const statusEl = row.querySelector('.goal-ticker-status');
    const textEl   = row.querySelector('.goal-ticker-text');

    const apply = () => {
      statusEl.setAttribute('data-status', item.status);
      statusEl.textContent = statusGlyph(item.status);
      textEl.textContent = item.text;
      row.classList.remove('is-fading');
    };

    if (firstTick) { apply(); firstTick = false; return; }
    row.classList.add('is-fading');
    setTimeout(apply, 220);
  }

  function startTicker() {
    tick();
    if (tickerTimer) clearInterval(tickerTimer);
    tickerTimer = setInterval(tick, 5000);
  }

  // ---------- Sleep Summary (reads sleepEntries saved by health.html#sleep) ----------
  function sleepDurationHours(bedTime, wakeTime) {
    if (!bedTime || !wakeTime) return null;
    const [bh, bm] = bedTime.split(':').map(Number);
    const [wh, wm] = wakeTime.split(':').map(Number);
    if ([bh, bm, wh, wm].some(isNaN)) return null;
    let diff = (wh * 60 + wm) - (bh * 60 + bm);
    if (diff <= 0) diff += 24 * 60;
    return diff / 60;
  }
  function loadSleepEntries() {
    try { const v = JSON.parse(localStorage.getItem('sleepEntries')); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function formatDate(yyyy_mm_dd) {
    const parts = yyyy_mm_dd.split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    const wk = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    return wk + ', ' + mo + ' ' + d.getDate();
  }
  function renderSleepSummary() {
    const entries = loadSleepEntries();
    const valueEl = document.getElementById('sleepSummaryValue');
    const subEl = document.getElementById('sleepSummarySub');
    if (!entries.length) {
      valueEl.textContent = 'No data yet';
      subEl.textContent = 'Log your first night to start tracking.';
      return;
    }
    const last = entries.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
    const hours = sleepDurationHours(last.bedTime, last.wakeTime);
    valueEl.textContent = hours != null ? hours.toFixed(1) + 'h' : '—';
    subEl.textContent = formatDate(last.date);
  }
  renderSleepSummary();

  // ============================================================
  // DataLayer boot — auth-gated (same as before this migration).
  // Runs the one-shot goals_daily -> tasks migration, loads the real
  // 'tasks' collection, renders, and subscribes for realtime cross-
  // device/cross-page updates (main.html <-> index.html's kernel panel).
  // ============================================================
  document.addEventListener('DOMContentLoaded', async function initTasksDataLayer() {
    if (typeof DataLayer === 'undefined') return;
    const session = await DataLayer.init({ requireAuth: true });
    if (!session) return; // redirected to login.html

    await migrateGoalsToTasksIfNeeded();
    tasksCache = await DataLayer.list('tasks');
    dlReady = true;
    refreshLegacyGoalsMirror();
    renderAll();
    startTicker();

    DataLayer.subscribe('tasks', async () => {
      tasksCache = await DataLayer.list('tasks');
      refreshLegacyGoalsMirror();
      scheduleRender();
      cycleIdx = 0;
      tick();
    });
  });
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof initCloudSync !== 'function') return;
  initCloudSync({
    appKey: 'goals',
    syncedPrefixes: ['goals:'],
    onApplied: function () {
      window.dispatchEvent(new CustomEvent('goals-changed'));
      window.dispatchEvent(new Event('storage'));
    }
  });
});
</script>
